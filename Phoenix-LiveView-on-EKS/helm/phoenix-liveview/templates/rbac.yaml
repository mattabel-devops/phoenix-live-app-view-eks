{{- if and .Values.serviceAccount.create .Values.rbac.create }}
# Namespaced Role — libcluster's Kubernetes strategy only needs to read
# objects in the same namespace as the workload. A ClusterRole would be
# overreach (and a finding in any reasonable IL5/STIG audit).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "phoenix-liveview.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phoenix-liveview.labels" . | nindent 4 }}
rules:
  {{- toYaml .Values.rbac.rules | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "phoenix-liveview.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phoenix-liveview.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "phoenix-liveview.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "phoenix-liveview.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
