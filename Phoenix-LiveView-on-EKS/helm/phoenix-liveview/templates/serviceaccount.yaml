{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "phoenix-liveview.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "phoenix-liveview.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Token automounting is controlled at the pod level (see deployment.yaml).
# We deliberately do NOT set automountServiceAccountToken here, because
# some controllers (notably External Secrets Operator) need to read the
# SA token themselves, and disabling at SA level breaks that path.
{{- end }}
